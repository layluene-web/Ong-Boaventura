<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Boaventura |Cadastro </title
        >
      <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-cadastro">
     <header>
        <button class="menu-toggle" aria-label="Abrir menu">☰</button>
        <nav> <a href="../index.html" >Inicio</a>
            <a href="projetos.html">Projetos</a>
            <a href="../cadastro.html" class="Ativo">Cadastro</a>
        </nav>
    </header>
    <main>
        <h1 class="titulo-cadastro">Faça Parte da Boaventura</h1>
        <form> 
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
    <label for="cpf"> CPF</label>
    <input type="text" id="cpf" name="cpf" inputmode="numeric" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" placeholder="000.000.000-00">
</fieldset>
            

<fieldset>
    <legend>Contato</legend>
    <label for="telefone">Telefone com DDD</label>
    <input type="tel" id="telefone" name="telefone" required maxlength="15" placeholder="(00) 00000-0000" pattern="\(\d{2}\) \d{4,5}-\d{4}">
    
</fieldset>

   
<fieldset>
    <legend>Endereço</legend>
    <label for="cep">CEP

    </label>
    <input type="text" id="cep" name="cep" required
     inputmode="numeric" pattern="\d{5}-\d{3}" maxlength="9" placeholder="00000-000">
</fieldset>
<button type="submit">Enviar Cadastro</button>
<p class="alerta alerta-sucesso" id="mensagem-sucesso" style="display: none;">
    Cadastro enviado com sucesso! Entraremos em contato em breve.
</p>
<p class="alerta alerta-erro" id="mensagem-erro" style="display: none;">
    Por favor, corrija os campos destacados antes de enviar.
</p>
        </form>
    </main>
    
     <footer>
        <p>&copy; 2026 Boaventura</p>
    </footer>
<script src="../js/mascaras.js"></script>
<script src="../js/menu.js"></script>
</body>
</html>
